# CI for this repo, in both of its lives: the bare template, and a project
# created from it. The guard job below decides which.
name: CI

on:
  push:
  pull_request:

# Same-repo pull requests fire both a push event and a pull_request event for
# the identical commit, so without this every PR push doubles every job.
# Group by workflow + ref and cancel the superseded run rather than
# restricting push, so direct pushes to a branch with no open PR still get a
# CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Astro 7 requires Node 22.12.0 or higher. Keep in step with MIN_NODE in
  # scripts/setup.sh. '22' resolves to the latest 22.x, which satisfies it.
  NODE_VERSION: '22'

jobs:
  # Is this a scaffolded project or the bare template? There is no package.json
  # until scripts/setup.sh has run create-astro, so its presence is the signal.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false (bare template, nothing to build)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs only on the bare template (package.json absent), the inverse of the
  # guard above. Gives the template repo itself a green, meaningful CI run
  # instead of a run that skips everything.
  template:
    name: Template regression suite
    needs: guard
    if: needs.guard.outputs.run == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/test-template.sh

  # Needs live verification: this job has never actually run. It cannot run
  # on the bare template (guarded out above), and no project has been created
  # from this template and pushed yet to exercise it for real.
  quality:
    name: Type check, lint, format check, spell, test, build
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # After setup-node, so the corepack shims point at the Node just
      # installed rather than the runner's preinstalled one.
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check (astro check)
        run: make check
      - name: Lint (ESLint)
        run: make lint
      - name: Format check (Prettier)
        run: make format-check
      - name: Spell check (CSpell)
        run: make spell
      - name: Unit tests (Vitest)
        run: make test
      - name: Production build
        run: make build

  # Accessibility (axe-core) and visual regression (Playwright) checks,
  # sharing scan-urls.json. Guarded the same as quality: runs only once a
  # project has been scaffolded (package.json present). Inlines its own
  # build-serve sequence rather than calling scripts/browser-check.sh, so
  # both checks below run against one server instead of building and
  # serving twice; see CONVENTIONS.md, "Browser checks".
  #
  # Needs live verification: this job has never actually run in GitHub
  # Actions. It cannot run on the bare template (guarded out below) and no
  # project created from this template has pushed yet to exercise it for
  # real. The build-serve-scan sequence and the "generate baseline, do not
  # fail" first-run path were verified locally against a throwaway scaffold
  # instead; see template-docs/memory.md, "Browser checks verification".
  browser:
    name: Browser checks (accessibility + visual regression)
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Production build
        run: pnpm astro build

      - name: Serve the production build
        run: |
          # --background because Astro 7's preview server detaches anyway: the
          # command prints its address and exits, so a shell "&" and a $! PID
          # buy nothing and the next step needs the server to outlive this one.
          pnpm astro preview --background --port 4321 >/tmp/astro-preview.log 2>&1

          # Assert the port from what the server reported, not from a probe:
          # astro preview falls back to the next free port without failing, so
          # a 200 on 4321 would otherwise be taken as proof this server is the
          # one answering. A fresh runner has nothing on the port, but a
          # self-hosted one can carry a leftover daemon between runs.
          actual="$(grep -o 'http://localhost:[0-9]\{1,\}' /tmp/astro-preview.log | head -n 1)"
          if [ "$actual" != "http://localhost:4321" ]; then
            echo "The preview server started on '${actual:-an address that could not be read}', not http://localhost:4321." >&2
            cat /tmp/astro-preview.log
            exit 1
          fi

          ready=false
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:4321/ >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" = false ]; then
            echo "astro preview did not respond on http://localhost:4321." >&2
            cat /tmp/astro-preview.log
            exit 1
          fi

      - name: Accessibility scan (axe-core via Playwright)
        run: node scripts/a11y-scan.mjs --base-url=http://localhost:4321

      - name: Visual regression test (Playwright)
        id: vrt
        env:
          VRT_BASE_URL: http://localhost:4321
        run: |
          if [ -d tests/vrt/__screenshots__/linux ] && find tests/vrt/__screenshots__/linux -name '*.png' -print -quit | grep -q .; then
            echo "Committed Linux baselines found; comparing against them."
            pnpm exec playwright test tests/vrt
          else
            echo "No committed Linux baselines yet; generating them instead of failing this run."
            pnpm exec playwright test tests/vrt --update-snapshots
            echo "baselines_generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated VRT baselines
        if: steps.vrt.outputs.baselines_generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vrt-baselines-linux
          path: tests/vrt/__screenshots__/linux/
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Show preview server log
        if: failure()
        run: cat /tmp/astro-preview.log 2>/dev/null || true

      - name: Stop the preview server
        if: always()
        # Same lifecycle as scripts/browser-check.sh's cleanup: Astro 7's
        # preview server is a detached daemon, so it is stopped by name, not
        # by a PID the shell never owned. A hosted runner is discarded either
        # way; a self-hosted one would otherwise carry the daemon, and the
        # port it holds, into the next run.
        run: pnpm astro preview stop 2>/dev/null || true
